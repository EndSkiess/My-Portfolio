<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL_ACCESS</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .secret-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .admin-text {
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--text-primary);
            margin-bottom: 20px;
            min-height: 50px;
            text-shadow: 0 0 10px var(--text-primary);
        }

        .typing-cursor {
            display: inline-block;
            width: 15px;
            height: 30px;
            background-color: var(--text-primary);
            vertical-align: bottom;
            margin-left: 5px;
        }

        .prize-code {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1rem, 4vw, 2.5rem);
            color: var(--text-neon-pink);
            text-shadow: 0 0 20px var(--text-neon-pink);
            display: none;
            margin-top: 50px;
            padding: 20px;
            border: 2px solid var(--text-neon-pink);
            box-shadow: inset 0 0 20px var(--text-neon-pink);
            background-color: rgba(255, 0, 255, 0.1);
        }

        /* CRAZY GLITCH ANIMATION */
        body.crazy-glitch {
            animation: insane-glitch 0.2s linear infinite;
        }

        @keyframes insane-glitch {
            0% {
                transform: translate(0) scale(1);
                filter: hue-rotate(0deg);
            }

            20% {
                transform: translate(-20px, 15px) scale(1.05);
                filter: invert(1);
            }

            40% {
                transform: translate(15px, -15px) skewX(20deg);
                filter: hue-rotate(90deg);
                opacity: 0.8;
            }

            60% {
                transform: translate(-10px, 20px) scale(0.9);
                color: red;
                filter: invert(0);
            }

            80% {
                transform: translate(25px, 0) skewY(-20deg);
                color: lime;
                filter: invert(1);
            }

            100% {
                transform: translate(0) scale(1);
                filter: hue-rotate(180deg);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="crt-overlay"></div>
    <div class="scanlines"></div>

    <div class="secret-container" id="terminal">
        <div id="admin-dialogue" class="admin-text">
            <span id="typed-text"></span>
            <span class="typing-cursor blink" id="cursor"></span>
        </div>

        <div id="prize-container" class="prize-code glitch" data-text="[ CODE: 5091-7342-8819 ]" onclick="copyCode()"
            style="cursor: pointer;" title="Click to copy to clipboard!">
            [ CODE: 5091-7342-8819 ]
        </div>
    </div>

    <script>
        const typedText = document.getElementById('typed-text');
        const prize = document.getElementById('prize-container');

        // The dialogue exactly as requested
        const lines = [
            "Oh",
            "It seems like you were able to access this page",
            "Impressive",
            "Well since you did, you get one free prize",
            "Ready?"
        ];

        let lineIndex = 0;

        function typeLine(text, cb) {
            typedText.innerHTML = "";
            let i = 0;
            const typing = setInterval(() => {
                typedText.innerHTML += text[i];
                i++;
                if (i === text.length) {
                    clearInterval(typing);
                    setTimeout(cb, 1200); // Wait 1.2 seconds before replacing with next line
                }
            }, 80); // Typing speed
        }

        function startSequence() {
            if (lineIndex < lines.length) {
                typeLine(lines[lineIndex], () => {
                    lineIndex++;
                    startSequence();
                });
            } else {
                // Done writing lines, hide cursor and trigger glitch
                document.getElementById('cursor').style.display = 'none';
                triggerGlitch();
            }
        }

        function triggerGlitch() {
            // Apply intense full-screen glitch effect
            document.body.classList.add('crazy-glitch');

            setTimeout(() => {
                // Stop glitching after 3.5 seconds
                document.body.classList.remove('crazy-glitch');

                // Show final prize code
                typedText.innerHTML = "SYSTEM OVERRIDE SUCCESSFUL.";
                typedText.style.color = "var(--text-neon-cyan)";
                prize.style.display = 'inline-block';
            }, 3500);
        }

        function copyCode() {
            const codeToCopy = "5091-7342-8819";
            navigator.clipboard.writeText(codeToCopy).then(() => {
                const originalText = prize.innerHTML;
                prize.innerHTML = "[ COPIED TO CLIPBOARD ]";
                prize.setAttribute('data-text', "[ COPIED TO CLIPBOARD ]");
                prize.style.color = "var(--text-neon-cyan)";
                prize.style.borderColor = "var(--text-neon-cyan)";
                prize.style.boxShadow = "inset 0 0 20px var(--text-neon-cyan)";

                setTimeout(() => {
                    prize.innerHTML = originalText;
                    prize.setAttribute('data-text', "[ CODE: 5091-7342-8819 ]");
                    prize.style.color = "var(--text-neon-pink)";
                    prize.style.borderColor = "var(--text-neon-pink)";
                    prize.style.boxShadow = "inset 0 0 20px var(--text-neon-pink)";
                }, 2000);
            });
        }

        // Start 1 second after page loads
        setTimeout(startSequence, 1000);
    </script>
</body>

</html>
