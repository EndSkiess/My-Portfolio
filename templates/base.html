<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Retro Portfolio{% endblock %}</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Google AdSense -->
    {% if adsense_id %}
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ adsense_id }}"
     crossorigin="anonymous"></script>
    {% endif %}

    {% block extra_head %}{% endblock %}
</head>
<body>
    <canvas id="matrix-canvas" class="matrix-canvas"></canvas>
    
    <!-- Global CRT effects -->
    <div class="crt-overlay"></div>
    <div class="scanlines"></div>

    <div class="container">
        {% block content %}{% endblock %}

        <!-- Retro Ad Box -->
        {% if adsense_id %}
        <div class="retro-ad-container">
            <div class="ad-box">
                <div class="ad-label">[ SYSTEM ADVERTISEMENT ]</div>
                <!-- AdSense Unit Placeholder -->
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="{{ adsense_id }}"
                     data-ad-slot="default"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>
        {% endif %}

        <footer>
            <p class="blink-slow">System halted. End of file.</p>
        </footer>
    </div>

    <!-- Animation Toggle -->
    <div class="anim-control">
        <button id="anim-toggle" class="btn-retro anim-btn">
            [ ANIMATIONS: ON ]
        </button>
    </div>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/matrix.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
